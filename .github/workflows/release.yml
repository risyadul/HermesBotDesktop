name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Package app
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/package-app.sh "${TAG#v}"
      - name: Checksum
        run: |
          cd dist
          shasum -a 256 HermesBot-*-macos-arm64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: |
            dist/HermesBot-*-macos-arm64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/HermesBot-*-macos-arm64.zip dist/SHA256SUMS.txt \
            --title "$TAG" --generate-notes --verify-tag
