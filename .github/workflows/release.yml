name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Package app
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/package-app.sh "${TAG#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/HermesBot-*-macos-arm64.zip \
            --title "$TAG" --generate-notes --verify-tag
