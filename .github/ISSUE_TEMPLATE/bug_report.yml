name: Bug report
description: Something in the app does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not file it here; see SECURITY.md.
        Never paste tokens, API keys or session tokens. Redact logs before posting.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the app with ...
        2. Open Bot Chat / Group Chat ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Setup / connecting to the backend, Bots list, Bot Chat, Group Chat, Quit / cleanup, UI / layout, Other]
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend mode
      description: The app log says "attached" or "spawning".
      options: [Attached to a running backend (e.g. Hermes desktop app), App started its own backend, Not sure]
  - type: input
    id: app
    attributes:
      label: App commit
      placeholder: output of `git rev-parse --short HEAD`
    validations:
      required: true
  - type: input
    id: hermes
    attributes:
      label: Hermes Agent version
      placeholder: output of `hermes --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: macOS version, chip, Xcode / Swift version
      placeholder: e.g. macOS 15.5, Apple M2, Xcode 26 / Swift 6.3
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted)
      description: App console output and, if the app started its own backend, `~/Library/Logs/HermesBotApp/serve.log`.
      render: text
